services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - ./scraped_businesses.json:/app/scraped_businesses.json
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
